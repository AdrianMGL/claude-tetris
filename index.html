<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS ARCADE</title>
  <script>
    // Aplica el tema antes de pintar para evitar parpadeo
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
    <h1 class="game-title" aria-label="TETRIS ARCADE">
      <span aria-hidden="true" style="--c:#e57373;--i:0">T</span>
      <span aria-hidden="true" style="--c:#ffb74d;--i:1">E</span>
      <span aria-hidden="true" style="--c:#fff176;--i:2">T</span>
      <span aria-hidden="true" style="--c:#81c784;--i:3">R</span>
      <span aria-hidden="true" style="--c:#4dd0e1;--i:4">I</span>
      <span aria-hidden="true" style="--c:#7aa2f7;--i:5">S</span>
      <span aria-hidden="true" class="gap"> </span>
      <span aria-hidden="true" style="--c:#ba68c8;--i:6">A</span>
      <span aria-hidden="true" style="--c:#e57373;--i:7">R</span>
      <span aria-hidden="true" style="--c:#ffb74d;--i:8">C</span>
      <span aria-hidden="true" style="--c:#fff176;--i:9">A</span>
      <span aria-hidden="true" style="--c:#81c784;--i:10">D</span>
      <span aria-hidden="true" style="--c:#4dd0e1;--i:11">E</span>
    </h1>
    <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Tema claro" title="Cambiar tema">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>
    </button>
    </div>

    <div class="stage">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="menu-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden">
      <div id="pause-main" class="overlay-box">
        <p class="overlay-heading">PAUSA</p>
        <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
        <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
        <button id="controls-btn" class="menu-btn" type="button">Ver controles</button>
        <label class="level-picker">
          Nivel inicial
          <select id="start-level">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>
      </div>

      <div id="pause-controls" class="overlay-box controls hidden">
        <p class="overlay-heading">CONTROLES</p>
        <ul>
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
        <button id="controls-back-btn" class="menu-btn" type="button">Volver</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
