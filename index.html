<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS ARCADE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title" aria-label="TETRIS ARCADE">
      <span aria-hidden="true" style="--c:#e57373;--i:0">T</span>
      <span aria-hidden="true" style="--c:#ffb74d;--i:1">E</span>
      <span aria-hidden="true" style="--c:#fff176;--i:2">T</span>
      <span aria-hidden="true" style="--c:#81c784;--i:3">R</span>
      <span aria-hidden="true" style="--c:#4dd0e1;--i:4">I</span>
      <span aria-hidden="true" style="--c:#7aa2f7;--i:5">S</span>
      <span aria-hidden="true" class="gap"> </span>
      <span aria-hidden="true" style="--c:#ba68c8;--i:6">A</span>
      <span aria-hidden="true" style="--c:#e57373;--i:7">R</span>
      <span aria-hidden="true" style="--c:#ffb74d;--i:8">C</span>
      <span aria-hidden="true" style="--c:#fff176;--i:9">A</span>
      <span aria-hidden="true" style="--c:#81c784;--i:10">D</span>
      <span aria-hidden="true" style="--c:#4dd0e1;--i:11">E</span>
    </h1>

    <div class="stage">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
