name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    # Evita bucles y ejecuciones de bots
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    # Una sola ejecución por issue: si el issue se edita varias veces seguidas,
    # se cancela la ejecución anterior y se mantiene la más reciente.
    concurrency:
      group: claude-issue-triage-${{ github.event.issue.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres un asistente de triage para el issue #${{ github.event.issue.number }}
            del repositorio ${{ github.repository }} (juego Tetris en HTML/CSS/JS vanilla).
            El issue fue ${{ github.event.action == 'opened' && 'creado' || 'editado' }}.

            Tu tarea, en este orden:

            1. Lee el issue con `gh issue view ${{ github.event.issue.number }}` y revisa el
               código relevante (`CLAUDE.md`, `game.js`, `index.html`, `style.css`).

            2. Asigna labels usando SOLO los labels que ya existen en el repositorio
               (consulta `gh label list`). No crees labels nuevos. Elige los que apliquen,
               por ejemplo: bug, enhancement, documentation, question, accessibility.
               Si el issue es un duplicado claro de otro, usa `duplicate`; si no es un
               problema válido o no se puede reproducir con la información dada, usa
               `invalid`. No cierres el issue.
               Aplica los labels con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
               Si el issue ya tenía labels de triage anteriores que ya no aplican, quítalos
               con `--remove-label`.

            3. Publica un diagnóstico en el issue con `gh issue comment`. Antes de publicar,
               busca si ya existe un comentario tuyo previo que contenga la marca
               `<!-- claude-triage -->` (con `gh issue view ${{ github.event.issue.number }} --comments`).
               - Si existe, edítalo con `gh api` (PATCH) en lugar de crear uno nuevo.
               - Si no existe, crea uno nuevo.
               El comentario DEBE empezar con la marca `<!-- claude-triage -->` y contener, en español:
               - **Resumen:** qué reporta o pide el issue en 2-3 líneas.
               - **Labels aplicados:** y por qué.
               - **Diagnóstico:** causa probable o área afectada, citando archivos y funciones
                 concretas (por ejemplo `collide`, `lockPiece`, `clearLines`, `draw`).
               - **Plan de implementación:** pasos concretos y ordenados para resolverlo o
                 implementarlo, respetando la arquitectura descrita en `CLAUDE.md`.
               - **Riesgos y casos borde:** qué podría romperse.
               - **Información faltante:** preguntas abiertas si el issue no tiene datos
                 suficientes (pasos para reproducir, navegador, comportamiento esperado).

            Reglas:
            - NO modifiques archivos del repositorio, no hagas commits y no abras PRs.
            - Tu única salida en GitHub son los labels y el comentario de diagnóstico.
            - Si la información es insuficiente, dilo explícitamente en el diagnóstico en lugar de inventar detalles.

          # Solo se permiten los comandos necesarios para leer el issue, aplicar labels y comentar
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*),Read,Grep,Glob"'
